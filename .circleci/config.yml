version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.12
    resource_class: small
    environment:
      REDOCLY_TELEMETRY: "off"
      REDOCLY_SUPPRESS_NOTIFICATIONS: "true"
      REDOCLY_CLI_VERSION: "2.72.1"

jobs:
  build-docs:
    executor: node
    steps:
      - checkout
      - run:
          name: Build static HTML documentation
          command: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" build-docs ssd-execute-openapi.yaml -o public/index.html
      - store_artifacts:
          path: public/index.html
          destination: api-docs/index.html

workflows:
  api-docs:
    jobs:
      - build-docs
